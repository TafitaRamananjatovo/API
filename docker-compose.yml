services:
  django-api:
    build: ./techs/django-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_NAME=Projet
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    volumes:
      - ./techs/django-api:/app
    depends_on:
      db:
        condition: service_healthy

  fastapi-service:
    build: ./techs/FastApi
    ports:
      - "8001:8000"
    volumes:
      - ./techs/FastApi:/app

  go-api:
    build: ./techs/go-api
    ports:
      - "8002:8080"
    volumes:
      - ./techs/go-api:/app

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=Projet
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
