name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_inventory_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Django dependencies
        run: pip install -r techs/django-api/requirements.txt
      - name: Run Django tests
        working-directory: techs/django-api
        env:
          DATABASE_HOST: localhost
          DATABASE_NAME: smart_inventory_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
        run: python manage.py test

  fastapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FastAPI dependencies
        run: pip install -r techs/FastApi/requirements.txt
      - name: Import FastAPI app
        run: python -c "from techs.FastApi.app.main import app; print(app.title)"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run Go tests
        working-directory: techs/go-api
        run: go test ./...

  docker:
    runs-on: ubuntu-latest
    needs: [django, fastapi, go]
    steps:
      - uses: actions/checkout@v4
      - name: Build Django image
        run: docker build -f techs/django-api/dockerfile techs/django-api
      - name: Build FastAPI image
        run: docker build -f techs/FastApi/dockerfile techs/FastApi
      - name: Build Go image
        run: docker build -f techs/go-api/dockerfile techs/go-api
